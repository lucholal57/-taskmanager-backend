<div class="flex items-center justify-center min-h-screen bg-gray-100 dark:bg-gray-900">
  <div
    class="w-full max-w-sm p-6 bg-white rounded-lg shadow-md dark:bg-gray-800 animate-fade-in"
    >
    <h1 class="mb-6 text-2xl font-bold text-center text-gray-800 dark:text-gray-100">
      Iniciar sesión
    </h1>
    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      <div class="mb-4">
        <label class="block mb-1 text-sm font-medium text-gray-700 dark:text-gray-300">
          Email
        </label>
        <input
          type="email"
          formControlName="email"
          class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 dark:bg-gray-700 dark:text-white dark:border-gray-600"
          placeholder="correo@ejemplo.com"
          />
        @if (loginForm.get('email')?.invalid && loginForm.get('email')?.touched) {
          <div
            class="mt-1 text-sm text-red-500"
            >
            Email inválido
          </div>
        }
      </div>

      <div class="mb-4">
        <label class="block mb-1 text-sm font-medium text-gray-700 dark:text-gray-300">
          Contraseña
        </label>
        <input
          type="password"
          formControlName="password"
          class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 dark:bg-gray-700 dark:text-white dark:border-gray-600"
          placeholder="********"
          />
        @if (loginForm.get('password')?.invalid && loginForm.get('password')?.touched) {
          <div
            class="mt-1 text-sm text-red-500"
            >
            Contraseña requerida
          </div>
        }
      </div>

      <button
        type="submit"
        [disabled]="isLoading"
        class="w-full px-4 py-2 font-semibold text-white bg-blue-500 rounded-lg hover:bg-blue-600 focus:outline-none focus:ring-2 focus:ring-blue-400 disabled:opacity-50 disabled:cursor-not-allowed"
        >
        @if (!isLoading) {
          <span>Entrar</span>
        }
        @if (isLoading) {
          <span class="flex items-center justify-center">
            <svg
              class="w-5 h-5 mr-2 text-white animate-spin"
              xmlns="http://www.w3.org/2000/svg"
              fill="none"
              viewBox="0 0 24 24"
              >
              <circle
                class="opacity-25"
                cx="12"
                cy="12"
                r="10"
                stroke="currentColor"
                stroke-width="4"
              ></circle>
              <path
                class="opacity-75"
                fill="currentColor"
                d="M4 12a8 8 0 018-8v8H4z"
              ></path>
            </svg>
            Cargando...
          </span>
        }
      </button>

    </form>
  </div>
</div>
