<div class="flex">
    <!-- Botón hamburguesa (visible solo en mobile) -->
    <button (click)="toggleSidebar()" class="absolute p-2 m-2 text-white bg-gray-800 rounded md:hidden">
        ☰
    </button>

    <!-- Sidebar -->
    <div class="fixed top-0 left-0 z-40 w-64 h-full text-white transition-transform duration-300 bg-gray-800 md:relative md:flex md:flex-col md:w-64 md:h-screen"
        [class.-translate-x-full]="!sidebarOpen && isMobileView">
        <div class="p-4 text-2xl font-bold border-b border-gray-700">
            TaskManager
        </div>
        <nav class="p-4 space-y-4">
            <a [routerLink]="['/dashboard']" routerLinkActive="bg-gray-700" [routerLinkActiveOptions]="{ exact: true }"
                class="flex items-center block gap-2 px-3 py-2 rounded hover:bg-gray-700">
                <i data-lucide="layout-dashboard"></i>
                Dashboard
            </a>

            <a [routerLink]="['/task']" routerLinkActive="bg-gray-700" [routerLinkActiveOptions]="{ exact: true }"
                class="flex items-center block gap-2 px-3 py-2 rounded hover:bg-gray-700">
                <i data-lucide="check-square"></i>
                Tareas
            </a>

            <a [routerLink]="['/user']" routerLinkActive="bg-gray-700" [routerLinkActiveOptions]="{ exact: true }"
                class="flex items-center block gap-2 px-3 py-2 rounded hover:bg-gray-700">
                <i data-lucide="users"></i>
                Usuarios
            </a>
        </nav>
        <div class="p-4 border-t border-gray-700">
            <div class="flex items-center justify-between p-4 border-t border-gray-700">
                <span>🌙 Modo oscuro</span>
                <label class="inline-flex items-center cursor-pointer">
                    <input type="checkbox" class="sr-only" [(ngModel)]="darkMode" (change)="toggleDarkMode()" />
                    <span class="w-10 h-5 bg-gray-400 rounded-full shadow-inner"></span>
                    <span class="absolute w-4 h-4 transition transform bg-white rounded-full dot"
                        [class.translate-x-5]="darkMode"></span>
                </label>
            </div>
            <button (click)="logout()" class="w-full px-4 py-2 bg-red-500 rounded hover:bg-red-600">
                Cerrar sesión
            </button>
        </div>
    </div>

    <!-- Contenido principal -->
    <div class="flex-1 min-h-screen p-6 ml-64 bg-gray-100 dark:bg-gray-800 md:ml-0">
        <router-outlet></router-outlet>
    </div>

</div>
